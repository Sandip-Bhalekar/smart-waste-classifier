[theme]
base = "light"
primaryColor = "#16704f"
backgroundColor = "#f4f7f5"
secondaryBackgroundColor = "#e8f3ec"
textColor = "#1b2a23"

[client]
# "minimal" hides the Share / star / edit / GitHub toolbar items when you don't need them.
# Remove this line if you want them visible.
toolbarMode = "minimal"
